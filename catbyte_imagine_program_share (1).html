    function renderBlockElementHtml(block, isPalette) {
      const catObj = BLOCK_CATEGORIES.find(c => c.id === block.category) || BLOCK_CATEGORIES[0];
      const defs = BLOCK_DEFINITIONS[block.category] || [];
      const def = defs.find(d => d.opcode === block.opcode) || { label: block.opcode, inputs: {} };
      const isHat = !!def.hat;
      const isRunning = !isPalette && vmActiveBlockId === block.id;

      // Build formatted label with inline editable inputs/selects/color pickers
      let htmlLabel = escapeHtml(def.label).replace(/\{(\w+)\}/g, (_, key) => {
        const val = (block.inputs && block.inputs[key] !== undefined) ? block.inputs[key] : (def.inputs[key] || '');
        if (isPalette) {
          if (def.colorInput === key) {
            return `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${escapeHtml(val)};border:1px solid #fff;vertical-align:middle;"></span>`;
          }
          return `<span class="block-input" style="display:inline-block;">${escapeHtml(val)}</span>`;
        }

        if (def.colorInput === key) {
          return `<input type="color" value="${escapeHtml(val)}" onmousedown="event.stopPropagation()" onchange="updateBlockInput('${block.id}', '${key}', this.value)" style="width:22px;height:18px;border:none;background:transparent;cursor:pointer;" />`;
        }
        if (def.selects && def.selects[key]) {
          return `<select class="block-select" onmousedown="event.stopPropagation()" onchange="updateBlockInput('${block.id}', '${key}', this.value)">
            ${def.selects[key].map(opt => `<option value="${escapeHtml(opt)}" ${opt === val ? 'selected' : ''}>${escapeHtml(opt)}</option>`).join('')}
          </select>`;
        }
        return `<input type="text" class="block-input" value="${escapeHtml(val)}" onmousedown="event.stopPropagation()" oninput="updateBlockInput('${block.id}', '${key}', this.value)" />`;
      });

      if (isPalette) {
        return `
          <div class="scratch-block ${isHat ? 'hat-block' : ''}"
            style="background:${catObj.color};"
            onclick="addBlockFromPalette('${block.category}', '${block.opcode}')">
            ${htmlLabel}
          </div>
        `;
      }

      return `
        <div class="scratch-block workspace-block ${isHat ? 'hat-block' : ''} ${isRunning ? 'running-glow' : ''}"
          data-block-id="${block.id}"
          style="background:${catObj.color};left:${block.x}px;top:${block.y}px;">
          ${htmlLabel}
        </div>
      `;
    }

    function updateBlockInput(blockId, key, val) {
      const proj = APP_STATE.studioProject;
      if (!proj) return;
      const b = proj.blocks.find(x => x.id === blockId);
      if (b) {
        b.inputs = b.inputs || {};
        b.inputs[key] = val;
      }
    }

    function addBlockFromPalette(category, opcode) {
      const proj = APP_STATE.studioProject;
      if (!proj) return;
      const defs = BLOCK_DEFINITIONS[category] || [];
      const def = defs.find(d => d.opcode === opcode);
      if (!def) return;

      const offset = (proj.blocks.length % 8) * 18;
      const newBlock = {
        id: 'blk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 5),
        category,
        opcode,
        inputs: JSON.parse(JSON.stringify(def.inputs || {})),
        x: 60 + offset - APP_STATE.studioPanX,
        y: 50 + offset - APP_STATE.studioPanY,
        nextId: null,
        parentId: null
      };
      proj.blocks.push(newBlock);
      renderMainView();
    }

    function panCodeCanvas(dx, dy) {
      APP_STATE.studioPanX += dx;
      APP_STATE.studioPanY += dy;
      const world = document.getElementById('code-canvas-world');
      if (world) world.style.transform = `translate(${APP_STATE.studioPanX}px, ${APP_STATE.studioPanY}px) scale(${APP_STATE.studioZoom})`;
    }

    function zoomCodeCanvas(delta) {
      APP_STATE.studioZoom = Math.max(0.55, Math.min(1.6, Number((APP_STATE.studioZoom + delta).toFixed(2))));
      const world = document.getElementById('code-canvas-world');
      if (world) world.style.transform = `translate(${APP_STATE.studioPanX}px, ${APP_STATE.studioPanY}px) scale(${APP_STATE.studioZoom})`;
    }

    function resetCodeCanvasView() {
      APP_STATE.studioZoom = 1;
      APP_STATE.studioPanX = 0;
      APP_STATE.studioPanY = 0;
      const world = document.getElementById('code-canvas-world');
      if (world) world.style.transform = `translate(0px, 0px) scale(1)`;
    }

    function getChainIds(blocks, headId) {
      const ids = [];
      const visited = new Set();
      let cur = blocks.find(b => b.id === headId);
      while (cur && !visited.has(cur.id)) {
        visited.add(cur.id);
        ids.push(cur.id);
        cur = cur.nextId ? blocks.find(b => b.id === cur.nextId) : null;
      }
      return ids;
    }

    function bindCodeCanvasInteractions() {
      const wrap = document.getElementById('code-canvas-wrap');
      const world = document.getElementById('code-canvas-world');
      const snapBar = document.getElementById('snap-preview-bar');
      const paletteEl = document.getElementById('block-palette');
      if (!wrap || !world) return;

      let dragMode = null; // 'block' | 'pan'
      let draggedHeadId = null;
      let chainIds = [];
      let startClientX = 0;
      let startClientY = 0;
      let startPositions = {};
      let startPanX = 0;
      let startPanY = 0;
      let didMove = false;
      let snapTargetBlock = null;

      function getPointerCoords(e) {
        if (e.touches && e.touches.length > 0) {
          return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
      }

      function onPointerDown(e) {
        if (e.target.closest('input, select, button')) return;
        const pt = getPointerCoords(e);
        startClientX = pt.x;
        startClientY = pt.y;
        didMove = false;

        const blockEl = e.target.closest('.workspace-block');
        if (blockEl) {
          e.preventDefault();
          dragMode = 'block';
          draggedHeadId = blockEl.getAttribute('data-block-id');
          const proj = APP_STATE.studioProject;
          const head = proj.blocks.find(b => b.id === draggedHeadId);
          if (!head) return;

          // Detach from previous parent if any
          if (head.parentId) {
            const parent = proj.blocks.find(b => b.id === head.parentId);
            if (parent && parent.nextId === head.id) parent.nextId = null;
            head.parentId = null;
          }

          chainIds = getChainIds(proj.blocks, draggedHeadId);
          startPositions = {};
          chainIds.forEach(id => {
            const b = proj.blocks.find(x => x.id === id);
            if (b) startPositions[id] = { x: b.x, y: b.y };
            const el = world.querySelector(`[data-block-id="${id}"]`);
            if (el) el.classList.add('dragging');
          });
        } else {
          dragMode = 'pan';
          startPanX = APP_STATE.studioPanX;
          startPanY = APP_STATE.studioPanY;
        }
      }

      function onPointerMove(e) {
        if (!dragMode) return;
        const pt = getPointerCoords(e);
        const dx = pt.x - startClientX;
        const dy = pt.y - startClientY;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) didMove = true;

        if (dragMode === 'pan') {
          APP_STATE.studioPanX = startPanX + dx;
          APP_STATE.studioPanY = startPanY + dy;
          world.style.transform = `translate(${APP_STATE.studioPanX}px, ${APP_STATE.studioPanY}px) scale(${APP_STATE.studioZoom})`;
          return;
        }

        if (dragMode === 'block') {
          const proj = APP_STATE.studioProject;
          const z = APP_STATE.studioZoom || 1;
          chainIds.forEach(id => {
            const b = proj.blocks.find(x => x.id === id);
            if (b && startPositions[id]) {
              b.x = Math.round(startPositions[id].x + dx / z);
              b.y = Math.round(startPositions[id].y + dy / z);
              const el = world.querySelector(`[data-block-id="${id}"]`);
              if (el) {
                el.style.left = b.x + 'px';
                el.style.top = b.y + 'px';
              }
            }
          });

          // Check top-to-bottom stack snapping against tail blocks not in dragged chain
          const head = proj.blocks.find(b => b.id === draggedHeadId);
          snapTargetBlock = null;
          if (head) {
            for (const candidate of proj.blocks) {
              if (chainIds.includes(candidate.id)) continue;
              if (candidate.nextId) continue; // Only snap to open bottom of a stack
              const targetY = candidate.y + 38;
              if (Math.abs(head.x - candidate.x) < 42 && Math.abs(head.y - targetY) < 26) {
                snapTargetBlock = candidate;
                break;
              }
            }
          }

          if (snapTargetBlock && snapBar) {
            snapBar.style.display = 'block';
            snapBar.style.left = snapTargetBlock.x + 'px';
            snapBar.style.top = (snapTargetBlock.y + 36) + 'px';
          } else if (snapBar) {
            snapBar.style.display = 'none';
          }
        }
      }

      function onPointerUp(e) {
        if (!dragMode) return;
        if (snapBar) snapBar.style.display = 'none';

        if (dragMode === 'block') {
          const proj = APP_STATE.studioProject;
          chainIds.forEach(id => {
            const el = world.querySelector(`[data-block-id="${id}"]`);
            if (el) el.classList.remove('dragging');
          });

          // Check if dropped over palette to delete chain
          const pt = e.changedTouches && e.changedTouches[0]
            ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY }
            : { x: e.clientX, y: e.clientY };

          if (paletteEl && didMove) {
            const palRect = paletteEl.getBoundingClientRect();
            if (pt.x <= palRect.right) {
              proj.blocks = proj.blocks.filter(b => !chainIds.includes(b.id));
              dragMode = null;
              showToast('Deleted block stack.');
              renderMainView();
              return;
            }
          }

          // Apply snap if close to candidate bottom
          if (snapTargetBlock && didMove) {
            const head = proj.blocks.find(b => b.id === draggedHeadId);
            if (head) {
              snapTargetBlock.nextId = head.id;
              head.parentId = snapTargetBlock.id;
              // Re-align entire chain cleanly underneath snapTargetBlock
              let cur = head;
              let idx = 1;
              while (cur) {
                cur.x = snapTargetBlock.x;
                cur.y = snapTargetBlock.y + idx * 38;
                cur = cur.nextId ? proj.blocks.find(b => b.id === cur.nextId) : null;
                idx++;
              }
              renderMainView();
            }
          } else if (!didMove && draggedHeadId) {
            // Clicked a block stack -> Execute that stack!
            runBlockChain(draggedHeadId);
          }
        }

        dragMode = null;
        draggedHeadId = null;
        chainIds = [];
        snapTargetBlock = null;
      }

      wrap.addEventListener('mousedown', onPointerDown);
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      wrap.addEventListener('touchstart', onPointerDown, { passive: false });
      window.addEventListener('touchmove', onPointerMove, { passive: false });
      window.addEventListener('touchend', onPointerUp);

      wrap.addEventListener('wheel', (e) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey) {
          zoomCodeCanvas(e.deltaY < 0 ? 0.08 : -0.08);
        } else {
          panCodeCanvas(-e.deltaX * 0.6, -e.deltaY * 0.6);
        }
      }, { passive: false });
    }

    /* =========================================================================
       11. STAGE DISPLAY, PEN ENGINE & VIRTUAL MACHINE EXECUTION
       ========================================================================= */
    let stageMousePos = { x: 0, y: 0 };
    let pendingAskResolve = null;

    function refreshStageDisplay() {
      const proj = APP_STATE.studioProject;
      if (!proj) return;
      const stageBox = document.getElementById('stage-box');
      const spriteEl = document.getElementById('stage-sprite');
      const graphicEl = document.getElementById('stage-sprite-graphic');
      if (!stageBox || !spriteEl) return;

      stageBox.style.background = proj.stageColor || '#FFFFFF';
      const sp = proj.sprite;
      spriteEl.style.display = sp.visible ? 'block' : 'none';

      // Convert Scratch coordinates (-240..240, -180..180) to percentage
      const leftPct = ((Number(sp.x) || 0) + 240) / 480 * 100;
      const topPct = (180 - (Number(sp.y) || 0)) / 360 * 100;
      spriteEl.style.left = `${leftPct}%`;
      spriteEl.style.top = `${topPct}%`;

      const scale = Math.max(0.15, (Number(sp.size) || 100) / 100);
      const rot = (Number(sp.direction) || 90) - 90;
      if (graphicEl) {
        graphicEl.innerHTML = renderCostumeSvg(sp.costumeId, 76, sp.hueShift);
        graphicEl.style.transform = `scale(${scale}) rotate(${rot}deg)`;
      }

      const monScore = document.getElementById('mon-score');
      const monMyVar = document.getElementById('mon-myvar');
      if (monScore) monScore.textContent = proj.variables?.score ?? 0;
      if (monMyVar) monMyVar.textContent = proj.variables?.['my variable'] ?? 0;
    }

    function clearPenCanvas() {
      const canvas = document.getElementById('stage-pen-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawPenSegment(x1, y1, x2, y2) {
      const proj = APP_STATE.studioProject;
      const canvas = document.getElementById('stage-pen-canvas');
      if (!proj || !canvas || !proj.sprite.penDown) return;
      const ctx = canvas.getContext('2d');
      ctx.strokeStyle = proj.sprite.penColor || '#4D97FF';
      ctx.lineWidth = Math.max(1, Number(proj.sprite.penSize) || 3);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(240 + x1, 180 - y1);
      ctx.lineTo(240 + x2, 180 - y2);
      ctx.stroke();
    }

    function stampSpriteOnPenCanvas() {
      const proj = APP_STATE.studioProject;
      const canvas = document.getElementById('stage-pen-canvas');
      if (!proj || !canvas) return;
      const ctx = canvas.getContext('2d');
      const costume = STARTING_COSTUMES.find(c => c.id === proj.sprite.costumeId) || STARTING_COSTUMES[0];
      const cx = 240 + (Number(proj.sprite.x) || 0);
      const cy = 180 - (Number(proj.sprite.y) || 0);
      const scale = (Number(proj.sprite.size) || 100) / 100;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(scale, scale);
      ctx.fillStyle = costume.primary;
      ctx.strokeStyle = '#1E293B';
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(-24, -10); ctx.lineTo(-22, -34); ctx.lineTo(-6, -20); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(24, -10); ctx.lineTo(22, -34); ctx.lineTo(6, -20); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.ellipse(0, 0, 26, 21, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#1E293B';
      ctx.beginPath(); ctx.arc(-9, -2, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(9, -2, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function bindStageInteractions() {
      const stageBox = document.getElementById('stage-box');
      const spriteEl = document.getElementById('stage-sprite');
      if (!stageBox || !spriteEl) return;

      stageBox.addEventListener('mousemove', (e) => {
        const rect = stageBox.getBoundingClientRect();
        stageMousePos.x = ((e.clientX - rect.left) / rect.width) * 480 - 240;
        stageMousePos.y = 180 - ((e.clientY - rect.top) / rect.height) * 360;
      });

      let draggingSprite = false;
      let spriteMoved = false;

      spriteEl.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        draggingSprite = true;
        spriteMoved = false;
      });

      window.addEventListener('mousemove', (e) => {
        if (!draggingSprite || !APP_STATE.studioProject) return;
        spriteMoved = true;
        const rect = stageBox.getBoundingClientRect();
        const nx = Math.max(-230, Math.min(230, ((e.clientX - rect.left) / rect.width) * 480 - 240));
        const ny = Math.max(-170, Math.min(170, 180 - ((e.clientY - rect.top) / rect.height) * 360));
        APP_STATE.studioProject.sprite.x = Math.round(nx);
        APP_STATE.studioProject.sprite.y = Math.round(ny);
        refreshStageDisplay();
      });

      window.addEventListener('mouseup', () => {
        if (draggingSprite) {
          draggingSprite = false;
          if (!spriteMoved) {
            triggerHatEvent('when_sprite_clicked');
          }
        }
      });

      spriteEl.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        triggerHatEvent('when_sprite_clicked');
      }, { passive: true });
    }

    // Global keyboard listener for "when [key] key pressed" hat blocks
    window.addEventListener('keydown', (e) => {
      if (e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
      if (APP_STATE.route !== 'studio' && APP_STATE.route !== 'project') return;
      const proj = APP_STATE.studioProject;
      if (!proj) return;

      const pressed = e.key === ' ' ? 'space' : e.key;
      const matchingHats = proj.blocks.filter(b => b.opcode === 'when_key' && (b.inputs?.key === pressed || b.inputs?.key?.toLowerCase() === pressed.toLowerCase()));
      if (matchingHats.length > 0) {
        e.preventDefault();
        matchingHats.forEach(hat => runBlockChain(hat.id));
      }
    });

    function triggerHatEvent(opcode) {
      const proj = APP_STATE.studioProject;
      if (!proj) return;
      const hats = proj.blocks.filter(b => b.opcode === opcode);
      hats.forEach(h => runBlockChain(h.id));
    }

    function startGreenFlag() {
      stopStudioExecution();
      triggerHatEvent('when_flag');
    }

    function stopStudioExecution() {
      vmRunToken++;
      vmActiveBlockId = null;
      stopAllCatSounds();
      const bubble = document.getElementById('stage-speech-bubble');
      if (bubble) bubble.style.display = 'none';
      const askBar = document.getElementById('stage-ask-bar');
      if (askBar) askBar.style.display = 'none';
      if (pendingAskResolve) {
        pendingAskResolve('');
        pendingAskResolve = null;
      }
      highlightActiveBlock(null);
    }

    function highlightActiveBlock(blockId) {
      vmActiveBlockId = blockId;
      document.querySelectorAll('.workspace-block.running-glow').forEach(el => el.classList.remove('running-glow'));
      if (blockId) {
        const el = document.querySelector(`.workspace-block[data-block-id="${blockId}"]`);
        if (el) el.classList.add('running-glow');
      }
    }

    function sleepToken(ms, token) {
      return new Promise(resolve => {
        setTimeout(() => resolve(token === vmRunToken), Math.max(10, ms));
      });
    }

    function askUserOnStage(questionText, token) {
      return new Promise(resolve => {
        const bar = document.getElementById('stage-ask-bar');
        const qEl = document.getElementById('stage-ask-question');
        const inEl = document.getElementById('stage-ask-input');
        if (!bar || !qEl || !inEl) {
          resolve('CatByte Friend');
          return;
        }
        qEl.textContent = questionText;
        inEl.value = '';
        bar.style.display = 'block';
        inEl.focus();
        pendingAskResolve = (ans) => {
          bar.style.display = 'none';
          const ansWrap = document.getElementById('mon-answer-wrap');
          const ansVal = document.getElementById('mon-answer');
          if (ansWrap && ansVal) {
            ansWrap.style.display = 'inline-flex';
            ansVal.textContent = ans;
          }
          resolve(ans);
        };
      });
    }

    function submitStageAskAnswer() {
      const inEl = document.getElementById('stage-ask-input');
      const val = inEl ? inEl.value : '';
      if (pendingAskResolve) {
        const fn = pendingAskResolve;
        pendingAskResolve = null;
        fn(val);
      }
    }

    function moveSpriteSteps(steps) {
      const proj = APP_STATE.studioProject;
      if (!proj) return;
      const sp = proj.sprite;
      const rad = ((Number(sp.direction) || 90) - 90) * (Math.PI / 180);
      const oldX = Number(sp.x) || 0;
      const oldY = Number(sp.y) || 0;
      const newX = oldX + Math.cos(rad) * steps;
      const newY = oldY - Math.sin(rad) * steps;
      sp.x = Math.max(-235, Math.min(235, newX));
      sp.y = Math.max(-175, Math.min(175, newY));
      drawPenSegment(oldX, oldY, sp.x, sp.y);
      refreshStageDisplay();
    }

    function bounceIfOnEdge() {
      const proj = APP_STATE.studioProject;
      if (!proj) return;
      const sp = proj.sprite;
      let dir = Number(sp.direction) || 90;
      let bounced = false;
      if (sp.x >= 215 || sp.x <= -215) {
        dir = -dir;
        sp.x = Math.max(-214, Math.min(214, sp.x));
        bounced = true;
      }
      if (sp.y >= 155 || sp.y <= -155) {
        dir = 180 - dir;
        sp.y = Math.max(-154, Math.min(154, sp.y));
        bounced = true;
      }
      if (bounced) {
        sp.direction = ((dir % 360) + 360) % 360;
        refreshStageDisplay();
      }
    }

    async function executeSingleBlock(block, token) {
      if (token !== vmRunToken) return false;
      const proj = APP_STATE.studioProject;
      if (!proj) return false;
      const sp = proj.sprite;
      const inp = block.inputs || {};
      highlightActiveBlock(block.id);

      switch (block.opcode) {
        case 'when_flag':
        case 'when_key':
        case 'when_sprite_clicked':
          break;

        case 'move_steps':
          moveSpriteSteps(Number(inp.steps) || 10);
          break;

        case 'turn_right':
          sp.direction = ((Number(sp.direction) || 90) + (Number(inp.deg) || 15)) % 360;
          refreshStageDisplay();
          break;

        case 'turn_left':
          sp.direction = ((Number(sp.direction) || 90) - (Number(inp.deg) || 15) + 360) % 360;
          refreshStageDisplay();
          break;

        case 'goto_xy': {
          const ox = sp.x, oy = sp.y;
          sp.x = Number(inp.x) || 0;
          sp.y = Number(inp.y) || 0;
          drawPenSegment(ox, oy, sp.x, sp.y);
          refreshStageDisplay();
          break;
        }

        case 'goto_target': {
          const ox = sp.x, oy = sp.y;
          if (inp.target === 'mouse-pointer') {
            sp.x = Math.round(stageMousePos.x);
            sp.y = Math.round(stageMousePos.y);
          } else {
            sp.x = Math.floor(Math.random() * 380) - 190;
            sp.y = Math.floor(Math.random() * 280) - 140;
          }
          drawPenSegment(ox, oy, sp.x, sp.y);
          refreshStageDisplay();
          break;
        }

        case 'glide_xy': {
          const secs = Math.max(0.05, Number(inp.secs) || 0.5);
          const stepsCount = 12;
          const startX = Number(sp.x) || 0;
          const startY = Number(sp.y) || 0;
          const targetX = Number(inp.x) || 0;
          const targetY = Number(inp.y) || 0;
          for (let i = 1; i <= stepsCount; i++) {
            if (token !== vmRunToken) return false;
            const prevX = sp.x, prevY = sp.y;
            sp.x = startX + ((targetX - startX) * i) / stepsCount;
            sp.y = startY + ((targetY - startY) * i) / stepsCount;
            drawPenSegment(prevX, prevY, sp.x, sp.y);
            refreshStageDisplay();
            await sleepToken((secs * 1000) / stepsCount, token);
          }
          break;
        }

        case 'point_dir':
          sp.direction = Number(inp.dir) || 90;
          refreshStageDisplay();
          break;

        case 'change_x': {
          const ox = sp.x, oy = sp.y;
          sp.x = (Number(sp.x) || 0) + (Number(inp.dx) || 10);
          drawPenSegment(ox, oy, sp.x, sp.y);
          refreshStageDisplay();
          break;
        }

        case 'change_y': {
          const ox = sp.x, oy = sp.y;
          sp.y = (Number(sp.y) || 0) + (Number(inp.dy) || 10);
          drawPenSegment(ox, oy, sp.x, sp.y);
          refreshStageDisplay();
          break;
        }

        case 'if_on_edge_bounce':
        case 'if_edge_then':
          bounceIfOnEdge();
          break;

        case 'say_secs': {
          const bubble = document.getElementById('stage-speech-bubble');
          if (bubble) {
            bubble.textContent = inp.msg || 'Meow!';
            bubble.style.display = 'block';
          }
          await sleepToken((Number(inp.secs) || 1) * 1000, token);
          if (bubble && token === vmRunToken) bubble.style.display = 'none';
          break;
        }

        case 'say': {
          const bubble = document.getElementById('stage-speech-bubble');
          if (bubble) {
            bubble.textContent = inp.msg || 'Hello!';
            bubble.style.display = 'block';
          }
          break;
        }

        case 'think_secs': {
          const bubble = document.getElementById('stage-speech-bubble');
          if (bubble) {
            bubble.textContent = '💭 ' + (inp.msg || 'Hmm...');
            bubble.style.display = 'block';
          }
          await sleepToken((Number(inp.secs) || 1) * 1000, token);
          if (bubble && token === vmRunToken) bubble.style.display = 'none';
          break;
        }

        case 'switch_costume':
          sp.costumeId = inp.costume || 'byte-cat';
          refreshStageDisplay();
          break;

        case 'next_costume': {
          const idx = STARTING_COSTUMES.findIndex(c => c.id === sp.costumeId);
          sp.costumeId = STARTING_COSTUMES[(idx + 1) % STARTING_COSTUMES.length].id;
          refreshStageDisplay();
          break;
        }

        case 'change_size':
          sp.size = Math.max(20, Math.min(300, (Number(sp.size) || 100) + (Number(inp.ds) || 10)));
          refreshStageDisplay();
          break;

        case 'set_size':
          sp.size = Math.max(20, Math.min(300, Number(inp.size) || 100));
          refreshStageDisplay();
          break;

        case 'change_color_effect':
          sp.hueShift = ((Number(sp.hueShift) || 0) + (Number(inp.val) || 25)) % 360;
          refreshStageDisplay();
          break;

        case 'clear_effects':
          sp.hueShift = 0;
          refreshStageDisplay();
          break;

        case 'show_sprite':
          sp.visible = true;
          refreshStageDisplay();
          break;

        case 'hide_sprite':
          sp.visible = false;
          refreshStageDisplay();
          break;

        case 'play_sound_done':
          playCatSound(inp.sound || 'Meow', APP_STATE.studioPitch);
          await sleepToken(450, token);
          break;

        case 'start_sound':
          playCatSound(inp.sound || 'Pop', APP_STATE.studioPitch);
          break;

        case 'change_pitch':
          APP_STATE.studioPitch = Math.max(0.5, Math.min(2.0, APP_STATE.studioPitch + (Number(inp.val) || 10) / 100));
          break;

        case 'stop_sounds':
          stopAllCatSounds();
          break;

        case 'wait_secs':
          await sleepToken((Number(inp.secs) || 0.5) * 1000, token);
          break;

        case 'stop_all':
          stopStudioExecution();
          return false;

        case 'ask_wait': {
          const ans = await askUserOnStage(inp.question || "What's your name?", token);
          proj.lastAnswer = ans;
          break;
        }

        case 'say_answer': {
          const bubble = document.getElementById('stage-speech-bubble');
          if (bubble) {
            bubble.textContent = `Hi ${proj.lastAnswer || 'Friend'}!`;
            bubble.style.display = 'block';
          }
          break;
        }

        case 'goto_mouse': {
          const dx = stageMousePos.x - (Number(sp.x) || 0);
          const dy = stageMousePos.y - (Number(sp.y) || 0);
          sp.direction = Math.round((Math.atan2(dx, dy) * 180) / Math.PI);
          refreshStageDisplay();
          break;
        }

        case 'random_move': {
          const min = Number(inp.min) || 5;
          const max = Number(inp.max) || 35;
          const rnd = Math.floor(Math.random() * (max - min + 1)) + min;
          moveSpriteSteps(rnd);
          break;
        }

        case 'random_xy': {
          const rx = Number(inp.rx) || 150;
          const ry = Number(inp.ry) || 100;
          const ox = sp.x, oy = sp.y;
          sp.x = Math.floor(Math.random() * (rx * 2 + 1)) - rx;
          sp.y = Math.floor(Math.random() * (ry * 2 + 1)) - ry;
          drawPenSegment(ox, oy, sp.x, sp.y);
          refreshStageDisplay();
          break;
        }

        case 'add_score_random': {
          const min = Number(inp.min) || 1;
          const max = Number(inp.max) || 5;
          const rnd = Math.floor(Math.random() * (max - min + 1)) + min;
          proj.variables.score = (Number(proj.variables.score) || 0) + rnd;
          refreshStageDisplay();
          break;
        }

        case 'set_var': {
          const vName = inp.var || 'score';
          proj.variables[vName] = Number(inp.val) || 0;
          refreshStageDisplay();
          break;
        }

        case 'change_var': {
          const vName = inp.var || 'score';
          proj.variables[vName] = (Number(proj.variables[vName]) || 0) + (Number(inp.val) || 1);
          refreshStageDisplay();
          break;
        }

        case 'erase_all':
          clearPenCanvas();
          break;

        case 'stamp':
          stampSpriteOnPenCanvas();
          break;

        case 'pen_down':
          sp.penDown = true;
          break;

        case 'pen_up':
          sp.penDown = false;
          break;

        case 'set_pen_color':
          sp.penColor = inp.color || '#4D97FF';
          break;

        case 'change_pen_size':
          sp.penSize = Math.max(1, (Number(sp.penSize) || 3) + (Number(inp.ds) || 2));
          break;

        case 'set_pen_size':
          sp.penSize = Math.max(1, Number(inp.size) || 4);
          break;
      }

      return token === vmRunToken;
    }

    async function runBlockChain(startBlockId) {
      const proj = APP_STATE.studioProject;
      if (!proj) return;
      const token = vmRunToken;
      let current = proj.blocks.find(b => b.id === startBlockId);

      while (current && token === vmRunToken) {
        if (current.opcode === 'forever_loop') {
          highlightActiveBlock(current.id);
          const loopBody = [];
          let walker = current.nextId ? proj.blocks.find(b => b.id === current.nextId) : null;
          while (walker) {
            loopBody.push(walker);
            walker = walker.nextId ? proj.blocks.find(b => b.id === walker.nextId) : null;
          }
          if (loopBody.length === 0) break;
          while (token === vmRunToken) {
            for (const stepBlk of loopBody) {
              const ok = await executeSingleBlock(stepBlk, token);
              if (!ok) return;
            }
            const stillRunning = await sleepToken(45, token);
            if (!stillRunning) return;
          }
          break;
        } else if (current.opcode === 'repeat_n') {
          highlightActiveBlock(current.id);
          const times = Math.max(1, Math.min(200, Number(current.inputs?.times) || 10));
          const b1 = current.nextId ? proj.blocks.find(b => b.id === current.nextId) : null;
          const b2 = (b1 && b1.nextId) ? proj.blocks.find(b => b.id === b1.nextId) : null;
          for (let i = 0; i < times; i++) {
            if (token !== vmRunToken) return;
            if (b1) await executeSingleBlock(b1, token);
            if (b2) await executeSingleBlock(b2, token);
            await sleepToken(35, token);
          }
          current = b2 ? (b2.nextId ? proj.blocks.find(b => b.id === b2.nextId) : null) : null;
          continue;
        } else {
          const ok = await executeSingleBlock(current, token);
          if (!ok) return;
          await sleepToken(30, token);
          current = current.nextId ? proj.blocks.find(b => b.id === current.nextId) : null;
        }
      }

      if (token === vmRunToken) {
        highlightActiveBlock(null);
      }
    }

    /* =========================================================================
       12. APPLICATION BOOTSTRAP
       ========================================================================= */
    window.onload = function () {
      try {
        loadDatabase();
        renderNavbar();
        renderMainView();
      } catch (err) {
        console.error('CatByte bootstrap error:', err);
      }
    };
  </script>
